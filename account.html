        .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight:**Настройка безопасности Supabase (Критически важно)**
Поскольку сайт работает полностью на стороне клиента (HTML+JS), любые ключи, встроенные в код, будут видны всем. Защитить базу данных от взлома через сам код нельзя — защита выстраивается **только на стороне сервера Supabase**.
* Перейди в панель управления Supabase -> **Authentication** -> **Providers** и включи **Email**.
* Перейди в раздел **Database** -> **Auth Policies (Row Level Security)**.
* Включи RLS для всех твоих таблиц.
* Создай политики (Policies), разрешающие чтение/запись только тем, у кого `auth.uid() = user_id`. Если этого не сделать, любой пользователь сможет отправить прямой запрос к твоей БД и изменить данные.

**Инструкция по интеграции**
* Я встроил систему авторизации (модальное окно, кнопки, логику Supabase) прямо в `index.html`. Это лучшее решение для SPA (Single Page Application), чтобы при входе страница не перезагружалась и 3D-модель не сбрасывалась.
* Найди в самом начале `<script>` строки `const SUPABASE_URL` и `const SUPABASE_ANON_KEY` и вставь туда свои ключи из настроек Supabase (Project Settings -> API).
* Версия сайта обновлена до **1.5.0**. Добавлена кнопка аккаунта в верхнюю панель и в мобильное меню.
